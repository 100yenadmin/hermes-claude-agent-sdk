name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HERMES_AGENT_HOST_ROOT: ${{ github.workspace }}/_host
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/_host
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out exact AgentRuntime v1 host contract
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 100yenadmin/hermes-agent-for-upstream-PR-only
          ref: e89d36a38fbb86b33d685ccf3a57f0557b891069
          path: _host
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exact host contract and dependencies
        run: python -m pip install --disable-pip-version-check -e ./_host
      - name: Install package and test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"
      - name: Run package contract tests
        run: python -m pytest
      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: python -m build
      - name: Retain exact-head wheel for artifact-equivalence readback
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; same pin as host CI
        with:
          name: candidate-wheel-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  package-lifecycle:
    name: Offline package lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install local lifecycle tooling
        run: python -m pip install --disable-pip-version-check \
          "build==1.3.0" "pytest==9.1.1" "setuptools==83.0.0"
      - name: Verify wheel and sdist lifecycle
        run: bash scripts/verify_package_lifecycle.sh
