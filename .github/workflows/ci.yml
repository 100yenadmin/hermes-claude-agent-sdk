name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HERMES_AGENT_HOST_ROOT: ${{ github.workspace }}/_host
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/_host
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out exact AgentRuntime v1 host contract
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 100yenadmin/hermes-agent-for-upstream-PR-only
          ref: b30242781379ea23107591ca8974e6210a9a34ac
          path: _host
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exact host contract and dependencies
        run: python -m pip install --disable-pip-version-check -e ./_host
      - name: Install package and test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"
      - name: Run installed-canary prerequisite regressions
        run: >-
          python -m pytest -q
          tests/test_tool_bridge.py tests/test_visible_turn.py
          tests/test_continuity.py tests/test_sdk_session.py
          tests/test_runtime_sdk_integration.py tests/test_ux_runtime_integration.py
          tests/test_turn_input.py
          _host/tests/agent/test_runtime_assistant_updates.py
          _host/tests/agent/test_runtime_attempt_accounting.py
      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: python -m build
      - name: Retain exact-head distributions for release verification
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; same pin as host CI
        with:
          name: distributions-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      # Retaining a candidate for the isolated smoke is not a release or a
      # claim that the complete deterministic suite has passed.
      - name: Run package contract tests
        run: python -m pytest --tb=short

  package-lifecycle:
    name: Offline package lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install local lifecycle tooling
        run: python -m pip install --disable-pip-version-check \
          "build==1.3.0" "pytest==9.1.1" "setuptools==83.0.0"
      - name: Verify wheel and sdist lifecycle
        run: bash scripts/verify_package_lifecycle.sh
