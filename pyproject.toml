[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-claude-agent-sdk"
version = "0.1.0rc1"
description = "Standalone Claude Agent SDK whole-turn runtime plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "AUTHORS"]
authors = [{ name = "hermes-claude-agent-sdk contributors" }]
dependencies = [
  "claude-agent-sdk==0.2.151",
  "pyyaml==6.0.3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = [
  "build==1.3.0",
  "pyyaml==6.0.3",
  "pytest==9.1.1",
]

[project.entry-points."hermes_agent.plugins"]
claude-agent-sdk = "hermes_claude_agent_sdk"

[project.entry-points."hermes_claude_agent_sdk.parity_executors"]
v3 = "hermes_claude_agent_sdk.parity.executors:EXECUTORS"

[project.scripts]
hermes-claude-agent-sdk = "hermes_claude_agent_sdk.__main__:main"
hermes-claude-agent-sdk-parity = "hermes_claude_agent_sdk.parity.cli:main"

[project.urls]
Homepage = "https://github.com/100yenadmin/hermes-claude-agent-sdk"
Issues = "https://github.com/100yenadmin/hermes-claude-agent-sdk/issues"
Source = "https://github.com/100yenadmin/hermes-claude-agent-sdk"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
